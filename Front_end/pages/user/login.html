<!DOCTYPE html>
<html lang="vi">
<head>
    <meta name="description" content="Football Fashion - Đăng nhập tài khoản.">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập | Football Fashion</title>

    <!-- Font Awesome & Google Fonts -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    
<link rel="stylesheet" href="../../styles/auth.css">
    <link rel="stylesheet" href="../../styles/responsive.css">
</head>
<body>

    <a href="../../../index.html" class="back-home">
        <i class="fa-solid fa-arrow-left"></i>
        Trở về trang chủ
    </a>

    <main class="auth-shell auth-login-shell">
        <aside class="auth-visual" aria-label="Football Fashion - Áo đấu và trang phục bóng đá">
            <div class="auth-visual-content">
                <span class="auth-visual-subtitle">FOOTBALL FASHION</span>
                <h2>Áo Đấu &amp; Trang Phục<br class="auth-visual-break"> Bóng Đá</h2>
                <p>Khám phá bộ sưu tập áo đấu bóng đá mới nhất dành cho những người yêu bóng đá.</p>
            </div>
        </aside>
        <section class="login-card auth-panel">
            <h1 class="auth-page-title">Đăng nhập tài khoản</h1>

        <div class="login-header">
            <a href="../../../index.html" class="logo">Football Fashion</a>
            <p>Đăng nhập để trải nghiệm mua sắm tuyệt vời</p>
        </div>

        <form action="#" method="POST">

            <div class="form-group">
                <label class="form-label" for="email">Email hoặc Số điện thoại</label>
                <div class="input-wrapper">
                    <i class="fa-regular fa-envelope"></i>
                    <input type="text" id="email" class="form-input" placeholder="nhapemail@example.com" required>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label" for="password">Mật khẩu</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" id="password" class="form-input" placeholder="••••••••" required>
                </div>
            </div>

            <div class="form-options">
                <label class="remember-me">
                    <input type="checkbox">
                    <span>Ghi nhớ đăng nhập</span>
                </label>
                <a href="#" class="forgot-pass">Quên mật khẩu?</a>
            </div>

            <button type="submit" class="btn-submit">Đăng nhập</button>

        </form>

        <div class="divider">
            <span>hoặc đăng nhập bằng</span>
        </div>

        <div class="social-login">
            <button class="btn-social">
                <i class="fa-brands fa-google social-google"></i>
                Google
            </button>
            <button class="btn-social">
                <i class="fa-brands fa-facebook social-facebook"></i>
                Facebook
            </button>
        </div>

        <div class="signup-link">
    Chưa có tài khoản? <a href="register.html">Đăng ký ngay</a>
</div>

        </section>
    </main>

</body>
</html>
