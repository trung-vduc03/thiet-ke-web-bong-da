<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STYLE HUB | Thanh Toán</title>
    <!-- Trỏ đến thư mục styles/ ở Front_end -->
    <link rel="stylesheet" href="../../styles/cart-checkout.css">
</head>
<body>
    <div id="app-header"></div>

    <main class="container">
        <!-- Thẻ H1 duy nhất -->
        <h1 class="page-title">Thông Tin Thanh Toán</h1>

        <form id="checkoutForm" class="checkout-grid">
            <div class="checkout-section">
                <h2 class="section-title">1. Địa chỉ nhận hàng</h2>
                <div class="form-group">
                    <label for="fullName">Họ và tên *</label>
                    <input type="text" id="fullName" class="form-control" required placeholder="Nguyễn Văn A">
                </div>
                <div class="form-group">
                    <label for="phone">Số điện thoại *</label>
                    <input type="tel" id="phone" class="form-control" required placeholder="0901234567">
                </div>
                <div class="form-group">
                    <label for="address">Địa chỉ cụ thể *</label>
                    <input type="text" id="address" class="form-control" required placeholder="Số nhà, tên đường...">
                </div>

                <h2 class="section-title">2. Phương thức thanh toán</h2>
                <div>
                    <label>
                        <input type="radio" name="payment" value="cod" checked> Thanh toán khi nhận hàng (COD)
                    </label>
                    <br><br>
                    <label>
                        <input type="radio" name="payment" value="banking"> Chuyển khoản ngân hàng (QR Code)
                    </label>
                </div>
            </div>

            <div class="checkout-section checkout-summary">
                <h2 class="section-title">Đơn hàng của bạn</h2>
                <div id="checkoutItems"></div>
                <div class="summary-row">
                    <span>Phí giao hàng:</span>
                    <span>30.000đ</span>
                </div>
                <div class="summary-row summary-total">
                    <span>Tổng thanh toán:</span>
                    <strong id="checkoutTotal" class="price-text">0đ</strong>
                </div>
                <button type="submit" class="btn-primary">Xác Nhận Đặt Hàng</button>
            </div>
        </form>
    </main>

    <div id="app-footer"></div>

    <script src="../../app.js"></script>
    <script src="./checkout.js"></script>
</body>
</html>
