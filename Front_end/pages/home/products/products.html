<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danh Sách Sản Phẩm | StyleHub</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../styles/style.css">
    <link rel="stylesheet" href="../styles/products.css">
</head>

<body>

    <!-- HEADER -->
    <header class="header">
        <div class="container nav-container">
            <a href="../index.html" class="logo">STYLE<span>HUB</span></a>
            <nav class="navbar">
                <ul>
                    <li><a href="../index.html">Trang chủ</a></li>
                    <li><a href="products.html" class="active">Sản phẩm</a></li>
                </ul>
            </nav>
            <div class="header-actions">
                <div class="search-box">
                    <input type="text" id="searchInput" placeholder="Tìm kiếm...">
                    <button type="button"><i class="fa-solid fa-magnifying-glass"></i></button>
                </div>
                <a href="cart.html" class="icon-btn">
                    <i class="fa-solid fa-bag-shopping"></i>
                    <span id="cartCountBadge" class="badge">0</span>
                </a>
            </div>
        </div>
    </header>

    <main class="container product-page-layout">
        <aside class="sidebar-filter">
            <div class="filter-header">
                <h3>Bộ Lọc</h3>
                <button type="button" id="resetFilterBtn" class="reset-btn">Xóa lọc</button>
            </div>
            
            <div class="filter-group">
                <h4>Kích Thước</h4>
                <div class="size-options">
                    <label><input type="checkbox" name="size" value="S"> <span>S</span></label>
                    <label><input type="checkbox" name="size" value="M"> <span>M</span></label>
                    <label><input type="checkbox" name="size" value="L"> <span>L</span></label>
                    <label><input type="checkbox" name="size" value="XL"> <span>XL</span></label>
                </div>
            </div>

            <div class="filter-group">
                <h4>Màu Sắc</h4>
                <div class="color-options">
                    <label><input type="checkbox" name="color" value="Đỏ"> Đỏ</label>
                    <label><input type="checkbox" name="color" value="Trắng"> Trắng</label>
                    <label><input type="checkbox" name="color" value="Đen"> Đen</label>
                    <label><input type="checkbox" name="color" value="Xanh"> Xanh</label>
                </div>
            </div>

            <div class="filter-group">
                <h4>Khoảng Giá</h4>
                <input type="range" id="priceFilter" min="0" max="3000000" step="50000" value="3000000" style="width: 100%;">
                <div style="display: flex; justify-content: space-between; font-size: 0.85rem; margin-top: 5px;">
                    <span>0đ</span>
                    <span id="priceValue">3.000.000đ</span>
                </div>
            </div>
        </aside>

        <section class="product-content">
            <div class="catalog-top-bar">
                <h1 class="page-title">Áo Đấu & Trang Phục</h1>
                <div style="display: flex; gap: 15px; align-items: center;">
                    <span id="productCount">Đang tải...</span>
                    <select id="sortProducts" style="padding: 5px; border-radius: 5px;">
                        <option value="default">Mặc định</option>
                        <option value="price-asc">Giá tăng dần</option>
                        <option value="price-desc">Giá giảm dần</option>
                    </select>
                </div>
            </div>
            
            <div id="productGrid" class="product-grid"></div>
            <div id="noProducts" style="display: none; text-align: center; padding: 50px;">Không có sản phẩm phù hợp.</div>
        </section>
    </main>

    <div id="quickViewModal" class="modal-overlay">
        <div class="modal-content">
            <button type="button" class="close-modal" id="closeModalBtn">&times;</button>
            <div id="modalBody" style="display: flex; gap: 20px;"></div>
        </div>

    </div>


    <!-- FOOTER -->
    <footer class="footer">
        <p>© 2026 StyleHub E-commerce.</p>
    </footer>

    <script src="../js/products.js"></script>
</body>
</html>
