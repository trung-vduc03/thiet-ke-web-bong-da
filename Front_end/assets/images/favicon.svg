<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1727" />
      <stop offset="100%" stop-color="#162e4a" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#16a34a" />
    </linearGradient>
  </defs>

  <!-- Background Circle -->
  <circle cx="32" cy="32" r="30" fill="url(#bgGrad)" stroke="url(#accentGrad)" stroke-width="3" />

  <!-- Outer Football Hexagon Ring -->
  <circle cx="32" cy="32" r="23" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="8 4" opacity="0.4" />

  <!-- Stylized Soccer Ball Center -->
  <!-- Center Pentagon -->
  <polygon points="32,22 39,27 36,36 28,36 25,27" fill="url(#accentGrad)" />

  <!-- Radiating Lines & Outer Patches -->
  <path d="M32,22 L32,13" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
  <path d="M39,27 L48,24" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
  <path d="M36,36 L43,44" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
  <path d="M28,36 L21,44" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
  <path d="M25,27 L16,24" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />

  <!-- Outer Corner Points -->
  <circle cx="32" cy="13" r="2.5" fill="#ffffff" />
  <circle cx="48" cy="24" r="2.5" fill="#ffffff" />
  <circle cx="43" cy="44" r="2.5" fill="#ffffff" />
  <circle cx="21" cy="44" r="2.5" fill="#ffffff" />
  <circle cx="16" cy="24" r="2.5" fill="#ffffff" />

  <!-- Small Top Star -->
  <polygon points="32,3 33.5,6.5 37,7 34.5,9.5 35,13 32,11 29,13 29.5,9.5 27,7 30.5,6.5" fill="#eab308" />
</svg>
